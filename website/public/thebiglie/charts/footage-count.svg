<svg viewBox="0 0 1120 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of January 6 footage volume figures from 4,800 hours produced to 44,000 hours total."><rect x="0" y="0" width="1120" height="840" fill="#12152b"/><text x="28" y="46" font-family="Inter,Helvetica,sans-serif" font-size="25" font-weight="900" fill="#f4f5f9">WHAT THEY SAID EXISTED, AND WHAT EXISTS</text><text x="28" y="74" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#a8adc4">Hours of January 6 Capitol closed-circuit footage, by what the record said and when it said it.</text><line x1="486.0" y1="122" x2="486.0" y2="676" stroke="#2b2f56" stroke-width="1"/><text x="486.0" y="114" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">0</text><line x1="596.0" y1="122" x2="596.0" y2="676" stroke="#2b2f56" stroke-width="1"/><text x="596.0" y="114" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">10k</text><line x1="706.0" y1="122" x2="706.0" y2="676" stroke="#2b2f56" stroke-width="1"/><text x="706.0" y="114" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">20k</text><line x1="816.0" y1="122" x2="816.0" y2="676" stroke="#2b2f56" stroke-width="1"/><text x="816.0" y="114" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">30k</text><line x1="970.0" y1="122" x2="970.0" y2="676" stroke="#2b2f56" stroke-width="1"/><text x="970.0" y="114" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">44,000</text><text x="728" y="92" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.4" fill="#7c81a0">HOURS OF FOOTAGE</text><rect x="14" y="126" width="1092" height="84" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="28" y="154" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">Actually produced to defendants</text><text x="28" y="176" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">515 cameras. Oct 2021 government filing, US v. Bingert.</text><rect x="486" y="140" width="52.8" height="30" rx="6" fill="#e0533f" fill-opacity=".82" stroke="#e0533f" stroke-width="1.6"/><text x="551.8" y="162" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#e0533f" letter-spacing=".5">4,800</text><text x="28" y="246" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">Produced from the USCP transfer</text><text x="28" y="268" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">Sept 2021 DOJ discovery status filing.</text><rect x="486" y="232" width="77.0" height="30" rx="6" fill="#e0913f" fill-opacity=".82" stroke="#e0913f" stroke-width="1.6"/><text x="576.0" y="254" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#e0913f" letter-spacing=".5">7,000</text><rect x="14" y="310" width="1092" height="84" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="28" y="338" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">Withheld as “not relevant to this case”</text><text x="28" y="360" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">Same filing. Same sentence.</text><rect x="486" y="324" width="77.0" height="30" rx="6" fill="#7c81a0" fill-opacity=".82" stroke="#7c81a0" stroke-width="1.6"/><text x="576.0" y="346" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#7c81a0" letter-spacing=".5">7,000</text><text x="28" y="430" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">What I knew about when I wrote this</text><text x="28" y="452" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">USCP footage handed to the FBI. Noon to 8 PM on Jan 6 only.</text><rect x="486" y="416" width="154.0" height="30" rx="6" fill="#8a93f8" fill-opacity=".82" stroke="#8a93f8" stroke-width="1.6"/><text x="653.0" y="438" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#8a93f8" letter-spacing=".5">14,000</text><rect x="14" y="494" width="1092" height="84" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="28" y="522" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">What my own motion put on the record</text><text x="28" y="544" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">Feb 2023, Dkt. 212. “More than double the amount said to previously be available.”</text><rect x="486" y="508" width="451.0" height="30" rx="6" fill="#d9b32a" fill-opacity=".82" stroke="#d9b32a" stroke-width="1.6"/><text x="950.0" y="530" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#d9b32a" letter-spacing=".5">41,000</text><text x="28" y="614" font-family="Inter,Helvetica,sans-serif" font-size="16.5" font-weight="800" fill="#f4f5f9">The House total, made public</text><text x="28" y="636" font-family="Inter,Helvetica,sans-serif" font-size="12.3" fill="#a8adc4">Nov 2023. Speaker Johnson begins posting. ~40,000 committed to release.</text><rect x="486" y="600" width="484.0" height="30" rx="6" fill="#4cc38a" fill-opacity=".82" stroke="#4cc38a" stroke-width="1.6"/><text x="983.0" y="622" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#4cc38a" letter-spacing=".5">44,000</text><rect x="14" y="708" width="1092" height="86" rx="10" fill="#0e1122" stroke="#d9b32a" stroke-width="1.5"/><text x="30" y="734" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">WHY THE NUMBER GREW</text><text x="30" y="758" font-family="Inter,Helvetica,sans-serif" font-size="13.5" fill="#f4f5f9">The 14,000 figure covered noon to 8 PM on one day, and only what the Capitol Police handed the FBI. Of that, half was withheld</text><text x="30" y="778" font-family="Inter,Helvetica,sans-serif" font-size="13.5" fill="#f4f5f9">as not relevant. What actually reached defendants was 4,800 hours. That is about 11 percent of what the House later made public.</text><text x="1096" y="824" text-anchor="end" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#d9b32a">REALRYANNICHOLS.COM</text><text x="24" y="824" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7c81a0">THE FOOTAGE COUNT</text></svg>