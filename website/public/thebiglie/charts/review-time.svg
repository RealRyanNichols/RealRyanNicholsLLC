<svg viewBox="0 0 1160 930" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of how many days it takes to watch January 6 discovery footage, against the 548 days Ryan Nichols was held awaiting trial."><rect width="1160" height="930" fill="#12152b"/><text x="34" y="52" font-family="Inter,Helvetica,sans-serif" font-size="26" font-weight="900" fill="#f4f5f9">HOW LONG IT TAKES TO WATCH IT</text><text x="34" y="80" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#a8adc4">Days required to review the footage, against the time I was actually held awaiting trial.</text><rect x="34" y="104" width="1092" height="62" rx="10" fill="#0e1122" stroke="#e0913f" stroke-width="1.5"/><text x="50" y="127" font-family="Inter,Helvetica,sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.8" fill="#e0913f">WHAT WE HAD TO REVIEW IT WITH</text><text x="50" y="151" font-family="Inter,Helvetica,sans-serif" font-size="14" fill="#f4f5f9">23 shared laptops for the whole jail. Two week checkout. A waiting list. One tablet app. Months at a stretch with no access at all.</text><line x1="464.0" y1="186" x2="464.0" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="464.0" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">0</text><line x1="552.4" y1="186" x2="552.4" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="552.4" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">1,000</text><line x1="640.7" y1="186" x2="640.7" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="640.7" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">2,000</text><line x1="729.1" y1="186" x2="729.1" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="729.1" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">3,000</text><line x1="817.5" y1="186" x2="817.5" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="817.5" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">4,000</text><line x1="950.0" y1="186" x2="950.0" y2="664" stroke="#2b2f56" stroke-width="1"/><text x="950.0" y="178" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">5,500</text><text x="707" y="156" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.4" fill="#7c81a0">DAYS</text><line x1="512.4" y1="186" x2="512.4" y2="686" stroke="#d9b32a" stroke-width="2.5" stroke-dasharray="7 5"/><rect x="14" y="186" width="1132" height="86" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="34" y="212" font-family="Inter,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#f4f5f9">The government's own estimate to view its 9 terabytes.</text><text x="34" y="234" font-family="Inter,Helvetica,sans-serif" font-size="12.2" fill="#a8adc4">Feb 2022 discovery filing. Watching around the clock.</text><rect x="464" y="198" width="9.0" height="32" rx="6" fill="#4cc38a" fill-opacity=".82" stroke="#4cc38a" stroke-width="1.6"/><text x="486.0" y="221" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#4cc38a">102 days</text><text x="34" y="308" font-family="Inter,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#f4f5f9">The government's own adopted figure for the CCTV it produced.</text><text x="34" y="330" font-family="Inter,Helvetica,sans-serif" font-size="12.2" fill="#a8adc4">Quoted from a defendant's math in its Dec 2023 filing.</text><rect x="464" y="294" width="21.9" height="32" rx="6" fill="#8a93f8" fill-opacity=".82" stroke="#8a93f8" stroke-width="1.6"/><text x="498.9" y="317" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#8a93f8">248 days</text><rect x="14" y="378" width="1132" height="86" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="34" y="404" font-family="Inter,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#f4f5f9">4,800 hours at eight hours a day.</text><text x="34" y="426" font-family="Inter,Helvetica,sans-serif" font-size="12.2" fill="#a8adc4">What actually reached defendants. One pass. No notes, no re-watching.</text><rect x="464" y="390" width="53.0" height="32" rx="6" fill="#e0913f" fill-opacity=".82" stroke="#e0913f" stroke-width="1.6"/><text x="530.0" y="413" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#e0913f">600 days</text><text x="34" y="500" font-family="Inter,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#f4f5f9">44,000 hours, watching every hour of every day.</text><text x="34" y="522" font-family="Inter,Helvetica,sans-serif" font-size="12.2" fill="#a8adc4">Five straight years without sleeping.</text><rect x="464" y="486" width="162.0" height="32" rx="6" fill="#e0533f" fill-opacity=".82" stroke="#e0533f" stroke-width="1.6"/><text x="639.0" y="509" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#e0533f">1,833 days</text><rect x="14" y="570" width="1132" height="86" rx="8" fill="#1b1f3e" fill-opacity=".45"/><text x="34" y="596" font-family="Inter,Helvetica,sans-serif" font-size="15.5" font-weight="800" fill="#f4f5f9">44,000 hours at eight hours a day.</text><text x="34" y="618" font-family="Inter,Helvetica,sans-serif" font-size="12.2" fill="#a8adc4">Fifteen years. To watch it once.</text><rect x="464" y="582" width="486.0" height="32" rx="6" fill="#e0533f" fill-opacity=".82" stroke="#e0533f" stroke-width="1.6"/><text x="963.0" y="605" font-family="Inter,Helvetica,sans-serif" font-size="17" font-weight="900" fill="#e0533f">5,500 days</text><text x="512.4" y="706" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="1.2" fill="#d9b32a">548 DAYS</text><text x="512.4" y="724" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" fill="#a8adc4">the 18 months I sat in a cell awaiting trial</text><rect x="14" y="746" width="1132" height="96" rx="10" fill="#0e1122" stroke="#d9b32a" stroke-width="1.5"/><text x="30" y="772" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">READ THAT AGAIN</text><text x="30" y="798" font-family="Inter,Helvetica,sans-serif" font-size="14" fill="#f4f5f9">Watching a single pass of what they actually handed me takes longer than the entire time I was held. Watching everything that</text><text x="30" y="820" font-family="Inter,Helvetica,sans-serif" font-size="14" fill="#f4f5f9">existed, eight hours a day, takes fifteen years. They called that a fair opportunity to prepare a defense.</text><text x="1126" y="912" text-anchor="end" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#d9b32a">REALRYANNICHOLS.COM</text><text x="34" y="912" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7c81a0">THE TIME IT TAKES</text></svg>