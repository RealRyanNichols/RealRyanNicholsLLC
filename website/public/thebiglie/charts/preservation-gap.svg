<svg viewBox="0 0 1180 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline showing that 28,386 hours of footage from January 3 through 6 2021 passed a 30-day deletion deadline in early February, five months before the Select Committee that received it existed."><rect width="1180" height="980" fill="#12152b"/><text x="36" y="56" font-family="Inter,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#f4f5f9">THE PRESERVATION GAP</text><text x="36" y="86" font-family="Inter,Helvetica,sans-serif" font-size="15" fill="#a8adc4">28,386 hours survived a deadline that should have deleted them, five months before anyone asked for them.</text><rect x="247.1" y="150" width="15.6" height="300" fill="#e0913f" fill-opacity=".16"/><line x1="60.0" y1="330" x2="1120.0" y2="330" stroke="#2b2f56" stroke-width="3"/><line x1="80.8" y1="330" x2="80.8" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="80.8" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Jan</text><line x1="241.9" y1="330" x2="241.9" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="241.9" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Feb</text><line x1="387.4" y1="330" x2="387.4" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="387.4" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Mar</text><line x1="548.4" y1="330" x2="548.4" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="548.4" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Apr</text><line x1="704.3" y1="330" x2="704.3" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="704.3" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">May</text><line x1="865.4" y1="330" x2="865.4" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="865.4" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Jun</text><line x1="1021.3" y1="330" x2="1021.3" y2="340" stroke="#2b2f56" stroke-width="1.2"/><text x="1021.3" y="358" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Jul</text><line x1="106.8" y1="330" x2="106.8" y2="290.0" stroke="#e0533f" stroke-width="1.8"/><rect x="14.0" y="194.0" width="300" height="96" rx="10" fill="#1b1f3e" stroke="#e0533f" stroke-width="1.6"/><text x="28.0" y="218.0" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="1.4" fill="#e0533f">JANUARY 6</text><text x="28.0" y="240.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">The event.</text><circle cx="106.8" cy="330" r="8" fill="#0e1122" stroke="#e0533f" stroke-width="3"/><line x1="127.5" y1="330" x2="127.5" y2="384.0" stroke="#a8adc4" stroke-width="1.8"/><rect x="14.0" y="384.0" width="300" height="96" rx="10" fill="#1b1f3e" stroke="#a8adc4" stroke-width="1.6"/><text x="28.0" y="408.0" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="1.4" fill="#a8adc4">JAN 10-11</text><text x="28.0" y="430.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">The only transfer documents in evidence.</text><text x="28.0" y="446.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">Information Sharing Agreements with the</text><text x="28.0" y="462.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">FBI and MPD. They govern control, not</text><text x="28.0" y="478.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">preservation, and name no date range.</text><circle cx="127.5" cy="330" r="8" fill="#0e1122" stroke="#a8adc4" stroke-width="3"/><line x1="262.6" y1="330" x2="262.6" y2="290.0" stroke="#e0913f" stroke-width="1.8"/><rect x="112.6" y="194.0" width="300" height="96" rx="10" fill="#1b1f3e" stroke="#e0913f" stroke-width="1.6"/><text x="126.6" y="218.0" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="1.4" fill="#e0913f">~FEB 5</text><text x="126.6" y="240.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">By now every day from Jan 3 through Jan 6</text><text x="126.6" y="256.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">has passed its 30-day deletion deadline.</text><circle cx="262.6" cy="330" r="8" fill="#0e1122" stroke="#e0913f" stroke-width="3"/><line x1="470.5" y1="330" x2="470.5" y2="384.0" stroke="#8a93f8" stroke-width="1.8"/><rect x="320.5" y="384.0" width="300" height="96" rx="10" fill="#1b1f3e" stroke="#8a93f8" stroke-width="1.6"/><text x="334.5" y="408.0" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="1.4" fill="#8a93f8">MARCH 17</text><text x="334.5" y="430.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">DiBiase swears the Department preserved</text><text x="334.5" y="446.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">footage “starting at noon and continuing</text><text x="334.5" y="462.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">until 8:00 p.m.” Eight hours.</text><circle cx="470.5" cy="330" r="8" fill="#0e1122" stroke="#8a93f8" stroke-width="3"/><line x1="1016.1" y1="330" x2="1016.1" y2="290.0" stroke="#4cc38a" stroke-width="1.8"/><rect x="866.0" y="194.0" width="300" height="96" rx="10" fill="#1b1f3e" stroke="#4cc38a" stroke-width="1.6"/><text x="880.0" y="218.0" font-family="Inter,Helvetica,sans-serif" font-size="12" font-weight="900" letter-spacing="1.4" fill="#4cc38a">JUNE 30</text><text x="880.0" y="240.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">H.Res. 503. The Select Committee comes</text><text x="880.0" y="256.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">into existence. Five months after that</text><text x="880.0" y="272.0" font-family="Inter,Helvetica,sans-serif" font-size="11.8" fill="#f4f5f9">footage would have deleted itself.</text><circle cx="1016.1" cy="330" r="8" fill="#0e1122" stroke="#4cc38a" stroke-width="3"/><text x="36" y="540" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">THE 41,057 HOURS THE SELECT COMMITTEE RECEIVED, SPLIT BY WHETHER ANY SWORN STATEMENT ACCOUNTS FOR IT</text><rect x="36" y="558" width="342.0" height="70" rx="8" fill="#8a93f8" fill-opacity=".85"/><rect x="378.0" y="558" width="766.0" height="70" rx="8" fill="#e0533f" fill-opacity=".85"/><text x="54" y="590" font-family="Inter,Helvetica,sans-serif" font-size="21" font-weight="900" fill="#0b1830">12,671</text><text x="54" y="608" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#0b1830">31% &#183; inside the sworn window</text><text x="398.0" y="590" font-family="Inter,Helvetica,sans-serif" font-size="21" font-weight="900" fill="#f4f5f9">28,386</text><text x="398.0" y="608" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#f4f5f9">69% &#183; no sworn statement accounts for how it survived</text><rect x="36" y="656" width="1108" height="70" rx="10" fill="#0e1122" stroke="#2b2f56" stroke-width="1.5"/><text x="56" y="686" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#f4f5f9">Per camera that is <tspan font-weight="900" fill="#d9b32a">51 hours</tspan> of footage &#8212; 15 hours a day across January 3, 4 and 5, plus 6 hours on the morning of January 6 &#8212; preserved</text><text x="56" y="708" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#f4f5f9">entirely outside the only preservation anyone has ever sworn to.</text><rect x="36" y="746" width="1108" height="130" rx="12" fill="#0e1122" stroke="#d9b32a" stroke-width="2"/><text x="56" y="774" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">THE QUESTION NOBODY HAS ANSWERED</text><text x="56" y="804" font-family="Inter,Helvetica,sans-serif" font-size="15" fill="#f4f5f9">Somebody preserved January 3, 4 and 5 in January of 2021, before the deadline ran, and before any committee that</text><text x="56" y="828" font-family="Inter,Helvetica,sans-serif" font-size="15" fill="#f4f5f9">later received it even existed. There is no preservation order in the public record. No litigation hold. No directive.</text><text x="56" y="856" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="900" fill="#d9b32a">Who gave that instruction, and on what date?</text><text x="1144" y="958" text-anchor="end" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#d9b32a">REALRYANNICHOLS.COM</text><text x="36" y="958" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7c81a0">THE PRESERVATION GAP</text></svg>