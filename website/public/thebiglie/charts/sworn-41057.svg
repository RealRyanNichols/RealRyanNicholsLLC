<svg viewBox="0 0 1140 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chart showing the sworn footage figures 12,671 plus 28,386 equals 41,057 hours against the 14,000 hours the government defended."><rect width="1140" height="720" fill="#12152b"/><text x="36" y="54" font-family="Inter,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#f4f5f9">41,057 HOURS, SWORN UNDER OATH</text><text x="36" y="82" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#a8adc4">Capitol Police General Counsel Thomas DiBiase, declaration of March 17, 2023. Filed into my own docket at ECF 245-3.</text><rect x="36" y="130" width="329.6" height="64" rx="8" fill="#8a93f8" fill-opacity=".85"/><rect x="365.6" y="130" width="738.4" height="64" rx="8" fill="#4cc38a" fill-opacity=".85"/><text x="54" y="170" font-family="Inter,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#0b1830">12,671</text><text x="383.6" y="170" font-family="Inter,Helvetica,sans-serif" font-size="20" font-weight="900" fill="#0b1830">28,386</text><text x="36" y="218" font-family="Inter,Helvetica,sans-serif" font-size="12.4" fill="#a8adc4">Noon to 8 PM on January 6. Exterior, Capitol and Visitor Center interiors.</text><text x="36" y="240" font-family="Inter,Helvetica,sans-serif" font-size="12.4" fill="#a8adc4">January 3, 4 and 5. Plus the morning of January 6, before any of it started.</text><text x="36" y="312" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#e0533f">WHAT THEY SPENT 2023 DEFENDING AS THE WHOLE UNIVERSE</text><rect x="36" y="328" width="364.2" height="46" rx="8" fill="#e0533f" fill-opacity=".8"/><text x="54" y="358" font-family="Inter,Helvetica,sans-serif" font-size="18" font-weight="900" fill="#f4f5f9">14,000</text><text x="416.2" y="358" font-family="Inter,Helvetica,sans-serif" font-size="14" font-weight="800" fill="#a8adc4">and 4,800 of it ever reached defendants</text><rect x="36" y="400" width="1068" height="150" rx="12" fill="#0e1122" stroke="#d9b32a" stroke-width="2"/><text x="56" y="430" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">THE FOOTNOTE THAT ENDS THE ARGUMENT &#183; ECF 71-1, NOVEMBER 2022</text><text x="56" y="466" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#f4f5f9">&#8220;In response to later requests from both committees, the Department provided footage from</text><text x="56" y="492" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#f4f5f9">the entire 24-hour period for January 6, 2021.&#8221;</text><text x="56" y="524" font-family="Inter,Helvetica,sans-serif" font-size="13" fill="#a8adc4">Sworn fifteen months before the House began releasing 40,000 hours. The committees already had the whole day.</text><rect x="36" y="578" width="1068" height="76" rx="10" fill="#0e1122" stroke="#e0913f" stroke-width="1.5"/><text x="56" y="604" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#e0913f">AND THE CLOCK THAT DECIDED IT ALL</text><text x="56" y="634" font-family="Georgia,serif" font-size="16.5" font-style="italic" fill="#f4f5f9">&#8220;Without affirmative preservation, all Department footage is automatically purged within 30 days.&#8221;</text><text x="1104" y="702" text-anchor="end" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#d9b32a">REALRYANNICHOLS.COM</text><text x="36" y="702" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7c81a0">SWORN, AND NEVER WITHDRAWN</text></svg>