<svg viewBox="0 0 1180 1034" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline showing that Capitol Police footage auto-deletes after 30 days, with the purge deadline for each date from December 28 2020 through January 6 2021."><rect width="1180" height="1034" fill="#12152b"/><text x="36" y="54" font-family="Inter,Helvetica,sans-serif" font-size="27" font-weight="900" fill="#f4f5f9">THE 30-DAY CLOCK</text><text x="36" y="82" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#a8adc4">Capitol Police footage deletes itself. Everything that survived, survived because somebody asked for it in time.</text><rect x="36" y="104" width="1108" height="86" rx="12" fill="#0e1122" stroke="#e0913f" stroke-width="2"/><text x="56" y="132" font-family="Inter,Helvetica,sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.7" fill="#e0913f">SWORN &#183; USCP GENERAL COUNSEL THOMAS DiBIASE &#183; ECF 71-1, FOOTNOTE 1</text><text x="56" y="166" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#f4f5f9">&#8220;Without affirmative preservation, all Department footage is automatically purged within 30 days.&#8221;</text><text x="36" y="222" font-family="Inter,Helvetica,sans-serif" font-size="14" fill="#a8adc4">Nobody has to decide to destroy anything. The clock does it. Each bar below is one day of footage and how long there was to ask for it.</text><line x1="150.0" y1="266" x2="1120.0" y2="266" stroke="#2b2f56" stroke-width="2"/><line x1="150.0" y1="266" x2="150.0" y2="724" stroke="#2b2f56" stroke-width="1"/><text x="150.0" y="256" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Dec 22</text><line x1="336.5" y1="266" x2="336.5" y2="724" stroke="#2b2f56" stroke-width="1"/><text x="336.5" y="256" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Jan 1</text><line x1="597.7" y1="266" x2="597.7" y2="724" stroke="#2b2f56" stroke-width="1"/><text x="597.7" y="256" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Jan 15</text><line x1="914.8" y1="266" x2="914.8" y2="724" stroke="#2b2f56" stroke-width="1"/><text x="914.8" y="256" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="700" fill="#7c81a0">Feb 1</text><line x1="429.8" y1="266" x2="429.8" y2="742" stroke="#e0533f" stroke-width="2.5" stroke-dasharray="6 4"/><text x="429.8" y="236" text-anchor="middle" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" letter-spacing="1.2" fill="#e0533f">JANUARY 6</text><rect x="14" y="284" width="1152" height="54" rx="8" fill="#1b1f3e" fill-opacity=".4"/><text x="36" y="306" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Dec 28</text><rect x="261.9" y="290" width="559.6" height="20" rx="5" fill="#8a93f8" fill-opacity=".28" stroke="#8a93f8" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="261.9" cy="300" r="6" fill="#8a93f8"/><text x="831.5" y="304" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#8a93f8">gone Jan 27</text><text x="36" y="368" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Dec 30</text><rect x="299.2" y="352" width="559.6" height="20" rx="5" fill="#8a93f8" fill-opacity=".28" stroke="#8a93f8" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="299.2" cy="362" r="6" fill="#8a93f8"/><text x="868.8" y="366" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#8a93f8">gone Jan 29</text><rect x="14" y="408" width="1152" height="54" rx="8" fill="#1b1f3e" fill-opacity=".4"/><text x="36" y="430" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Jan 1</text><rect x="336.5" y="414" width="559.6" height="20" rx="5" fill="#8a93f8" fill-opacity=".28" stroke="#8a93f8" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="336.5" cy="424" r="6" fill="#8a93f8"/><text x="906.2" y="428" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#8a93f8">gone Jan 31</text><text x="36" y="492" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Jan 3</text><rect x="373.8" y="476" width="559.6" height="20" rx="5" fill="#4cc38a" fill-opacity=".28" stroke="#4cc38a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="373.8" cy="486" r="6" fill="#4cc38a"/><text x="943.5" y="490" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#4cc38a">gone Feb 2</text><rect x="14" y="532" width="1152" height="54" rx="8" fill="#1b1f3e" fill-opacity=".4"/><text x="36" y="554" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Jan 4</text><rect x="392.5" y="538" width="559.6" height="20" rx="5" fill="#4cc38a" fill-opacity=".28" stroke="#4cc38a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="392.5" cy="548" r="6" fill="#4cc38a"/><text x="962.1" y="552" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#4cc38a">gone Feb 3</text><text x="36" y="616" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Jan 5</text><rect x="411.2" y="600" width="559.6" height="20" rx="5" fill="#4cc38a" fill-opacity=".28" stroke="#4cc38a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="411.2" cy="610" r="6" fill="#4cc38a"/><text x="980.8" y="614" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#4cc38a">gone Feb 4</text><rect x="14" y="656" width="1152" height="54" rx="8" fill="#1b1f3e" fill-opacity=".4"/><text x="36" y="678" font-family="Inter,Helvetica,sans-serif" font-size="15" font-weight="800" fill="#f4f5f9">Jan 6</text><rect x="429.8" y="662" width="559.6" height="20" rx="5" fill="#d9b32a" fill-opacity=".28" stroke="#d9b32a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="429.8" cy="672" r="6" fill="#d9b32a"/><text x="999.4" y="676" font-family="Inter,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#d9b32a">gone Feb 5</text><rect x="36" y="760" width="14" height="14" rx="3" fill="#4cc38a" fill-opacity=".6" stroke="#4cc38a" stroke-width="1.4"/><text x="60" y="772" font-family="Inter,Helvetica,sans-serif" font-size="13.6" font-weight="800" fill="#f4f5f9">In the sworn accounting</text><text x="560" y="772" font-family="Inter,Helvetica,sans-serif" font-size="12.4" fill="#a8adc4">DiBiase named Jan 3, 4, 5 and Jan 6 in the 41,057 hours.</text><rect x="36" y="790" width="14" height="14" rx="3" fill="#8a93f8" fill-opacity=".6" stroke="#8a93f8" stroke-width="1.4"/><text x="60" y="802" font-family="Inter,Helvetica,sans-serif" font-size="13.6" font-weight="800" fill="#f4f5f9">In the House archive, not in the sworn accounting</text><text x="560" y="802" font-family="Inter,Helvetica,sans-serif" font-size="12.4" fill="#a8adc4">Pope reviewed CHA terminals holding Dec 28 onward. No sworn figure covers those days.</text><rect x="36" y="820" width="14" height="14" rx="3" fill="#e0533f" fill-opacity=".6" stroke="#e0533f" stroke-width="1.4"/><text x="60" y="832" font-family="Inter,Helvetica,sans-serif" font-size="13.6" font-weight="800" fill="#f4f5f9">The eight hours preserved immediately</text><text x="560" y="832" font-family="Inter,Helvetica,sans-serif" font-size="12.4" fill="#a8adc4">Noon to 8 PM on January 6. That was the whole first decision.</text><rect x="36" y="866" width="1108" height="118" rx="12" fill="#0e1122" stroke="#d9b32a" stroke-width="2"/><text x="56" y="894" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.8" fill="#d9b32a">WHAT THIS MEANS</text><text x="56" y="922" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#f4f5f9">The first preservation was eight hours. Noon to eight, on one day. Everything else in this chart survived only because a</text><text x="56" y="944" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#f4f5f9">committee asked later, and every request had a deadline it did not set. Whatever nobody asked for in time was deleted</text><text x="56" y="966" font-family="Inter,Helvetica,sans-serif" font-size="14.5" fill="#f4f5f9">automatically, with no order, no log, and no way to ever know what it was.</text><text x="1144" y="1014" text-anchor="end" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#d9b32a">REALRYANNICHOLS.COM</text><text x="36" y="1014" font-family="Inter,Helvetica,sans-serif" font-size="11" font-weight="800" letter-spacing="1.6" fill="#7c81a0">THE 30-DAY CLOCK</text></svg>