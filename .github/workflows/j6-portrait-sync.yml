name: j6-portrait-sync

# Conservatively fills public J6 portrait placeholders from NPR's low-resolution
# archive assets. The script accepts exact unique full-name matches only,
# validates each remote image, excludes NPR's named non-DOJ credits, and never
# replaces a cleared or non-placeholder portrait.

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/scripts/sync-npr-j6-editorial-portraits.ts"
      - "website/lib/npr-j6-archive.ts"
      - ".github/workflows/j6-portrait-sync.yml"
  push:
    branches:
      - main
    paths:
      - "website/scripts/sync-npr-j6-editorial-portraits.ts"
      - "website/lib/npr-j6-archive.ts"
      - ".github/workflows/j6-portrait-sync.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply eligible portrait updates (leave off for a dry run)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: j6-portrait-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Apply on main
        if: github.event_name == 'push' || inputs.apply == true
        run: npx tsx scripts/sync-npr-j6-editorial-portraits.ts --apply --summary="$RUNNER_TEMP/j6-portrait-sync-summary.json"
      - name: Pull request or manual dry run
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.apply != true)
        run: npx tsx scripts/sync-npr-j6-editorial-portraits.ts --dry-run --summary="$RUNNER_TEMP/j6-portrait-sync-summary.json"
      - name: Upload audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j6-portrait-sync-${{ github.run_id }}
          path: ${{ runner.temp }}/j6-portrait-sync-summary.json
          if-no-files-found: warn
          retention-days: 30
