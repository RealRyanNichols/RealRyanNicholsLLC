name: publish-articles

# Publishes markdown articles to the live posts table after merge to main.
# The publisher performs a complete preflight before any write and refuses to
# publish a new live article without an article-specific 1200×630 OG image.

concurrency:
  group: publish-articles-production
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "website/content/articles/**"
      - "website/public/social-cards/**"
      - "website/scripts/publish-articles.ts"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Publish articles (fails closed without a 1200x630 OG image)
        run: npx tsx scripts/publish-articles.ts