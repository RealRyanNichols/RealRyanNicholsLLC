name: courtlistener-import

# Long-running scraper that walks every J6 case_people row, queries
# Court Listener, and lands docs into pending_imports for Ryan to review
# at /admin/imports. Manual-trigger only by default — flip to a schedule
# once you've watched it run end-to-end and you're confident.

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 7 * * *"  # daily at 07:00 UTC

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npx tsx scripts/import-from-courtlistener.ts
